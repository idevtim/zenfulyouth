<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Zenful Youth</title>
  <desc id="desc">Meditations made just for you.</desc>

  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1429"/>
      <stop offset="45%" stop-color="#0D1226"/>
      <stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
    <radialGradient id="glowPeri" cx="12%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#6F8CFF" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#6F8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmber" cx="96%" cy="8%" r="45%">
      <stop offset="0%" stop-color="#E9A86B" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#E9A86B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#C9D4FF"/>
      <stop offset="38%" stop-color="#8EA6FF"/>
      <stop offset="78%" stop-color="#3FB8C6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A2140"/>
    </radialGradient>
    <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#6F8CFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6F8CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="820" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="820" height="240" fill="url(#sky)"/>
    <rect width="820" height="240" fill="url(#glowPeri)"/>
    <rect width="820" height="240" fill="url(#glowEmber)"/>

    <!-- Stars -->
    <g fill="#F1F3FA">
      <circle cx="58" cy="30" r="1.4" opacity="0.6"/>
      <circle cx="148" cy="64" r="1" opacity="0.35"/>
      <circle cx="232" cy="22" r="1.2" opacity="0.45"/>
      <circle cx="402" cy="18" r="1" opacity="0.3"/>
      <circle cx="470" cy="210" r="1" opacity="0.25"/>
      <circle cx="560" cy="34" r="1.3" opacity="0.4"/>
      <circle cx="770" cy="212" r="1.2" opacity="0.3"/>
      <circle cx="790" cy="40" r="1.5" opacity="0.5"/>
      <circle cx="36" cy="200" r="1" opacity="0.25"/>
    </g>

    <!-- The breathing orb and its rings -->
    <g transform="translate(660 120)">
      <circle r="98" fill="url(#orbHalo)"/>
      <circle r="88" fill="none" stroke="#8EA6FF" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="2 6"/>
      <circle r="72" fill="none" stroke="#F1F3FA" stroke-opacity="0.08" stroke-width="1"/>
      <circle r="56" fill="url(#orb)"/>
    </g>

    <!-- Wordmark and line -->
    <text x="56" y="88" font-family="'New York', ui-serif, Georgia, 'Times New Roman', serif" font-weight="600" font-size="22" fill="#F3C58A">Zenful Youth</text>
    <text x="56" y="140" font-family="'New York', ui-serif, Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#F1F3FA" letter-spacing="-0.4">Say what's on your mind.</text>
    <text x="56" y="178" font-family="'SF Pro Rounded', ui-rounded, -apple-system, 'Segoe UI', sans-serif" font-weight="500" font-size="18" fill="#AEB9D3">A meditation made just for you, in a calm voice.</text>
  </g>
</svg>
